/* ── Corporate Structural Layout & Overrides ── */
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --base-deep: #0F1115;
  --base-mid: #161A20;
  --base-soft: #1C2128;
  --slate-warm: #6B7280;
  --slate-light: #9CA3AF;
  --graphite: #2A2E35;
  --ivory: #E5E7EB;
  --ivory-muted: #C9CDD4;
  --silver: #B0B8C4;
  --panel-bg: rgba(22, 26, 32, 0.65);
  --panel-border: rgba(156, 163, 175, 0.08);
  --silk-ease: cubic-bezier(0.16, 1, 0.3, 1);
  --accent-gold: #d4af37;
  --accent-green: #48bb78;
  --accent-cyan: #38bdf8;
  --accent-red: #ef4444;
  --accent-purple: #a855f7;
}

body {
  font-family: 'Montserrat', sans-serif;
  background: var(--base-deep);
  color: var(--ivory);
  min-height: 100vh;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}

/* Background Grid Overlay */
.page-grid-overlay {
  position: fixed;
  inset: 0;
  width: 100vw;
  height: 100vh;
  z-index: 1;
  pointer-events: none;
  --mx: 50vw;
  --my: 50vh;
  background-image:
    linear-gradient(to right, rgba(156, 163, 175, 0.12) 1px, transparent 1px),
    linear-gradient(to bottom, rgba(156, 163, 175, 0.12) 1px, transparent 1px);
  background-size: 100px 100px;
  background-position: center center;
  -webkit-mask-image: radial-gradient(circle 420px at var(--mx) var(--my), rgba(0,0,0,1) 0%, transparent 75%);
  mask-image: radial-gradient(circle 420px at var(--mx) var(--my), rgba(0,0,0,1) 0%, transparent 75%);
}

/* ── Layout Framework ── */
.shell { display: grid; grid-template-columns: 280px 1fr; min-height: 100vh; position: relative; z-index: 10; }

.sidebar {
  position: fixed; width: 280px; height: 100vh; padding: 28px 20px;
  border-right: 1px solid var(--panel-border); background: rgba(15, 17, 21, 0.92);
  backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px);
  display: flex; flex-direction: column; z-index: 100;
}

.portal-brand {
  display: flex; align-items: center; gap: 12px;
  text-decoration: none; padding: 0 8px; margin-bottom: 32px;
}
.portal-brand img { max-height: 52px; width: auto; object-fit: contain; }

.nav-label {
  font-size: 9px; font-weight: 600; letter-spacing: .25em;
  text-transform: uppercase; color: var(--slate-warm); margin: 16px 12px 8px;
}

.portal-nav { display: grid; gap: 6px; }
.portal-nav button {
  border: 0; background: transparent; color: var(--slate-light); text-align: left;
  padding: 12px 16px; border-radius: 100px; cursor: pointer; transition: 0.35s var(--silk-ease);
  display: flex; align-items: center; gap: 12px; font-size: 11px; font-weight: 500; letter-spacing: 0.05em;
}
.portal-nav button:hover, .portal-nav button.active {
  background: rgba(176, 184, 196, 0.08); color: var(--ivory);
}
.portal-nav button.active { border: 1px solid var(--panel-border); font-weight: 600; }
.portal-nav .icon { width: 18px; text-align: center; color: var(--silver); font-size: 14px; }

.sidebar-foot { margin-top: auto; border-top: 1px solid var(--panel-border); padding-top: 18px; }
.mini-profile { display: flex; align-items: center; gap: 12px; padding: 8px; }
.avatar {
  width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center;
  background: var(--graphite); border: 1px solid var(--panel-border); font-size: 12px; font-weight: 600; color: var(--silver);
}
.mini-profile strong { font-size: 11px; color: var(--ivory); display: block; }
.mini-profile small { display: block; color: var(--slate-warm); font-size: 9px; margin-top: 3px; }

/* ── Main Workspace ── */
.workspace { grid-column: 2; padding: 36px 48px 80px; max-width: 1400px; width: 100%; }
.topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 36px; }
.eyebrow { font-size: 9px; font-weight: 600; letter-spacing: .28em; text-transform: uppercase; color: var(--slate-warm); margin-bottom: 8px; }
.topbar h1 { font-weight: 300; font-size: clamp(1.8rem, 2.5vw, 2.5rem); letter-spacing: -.04em; }
.topbar h1 strong { font-weight: 600; }
.top-actions { display: flex; gap: 12px; align-items: center; }

.circle-btn {
  width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--panel-border);
  background: var(--panel-bg); color: var(--ivory-muted); cursor: pointer; display: inline-grid;
  place-items: center; font-size: 14px; transition: 0.3s var(--silk-ease);
}
.circle-btn:hover { border-color: rgba(176,184,196,0.3); transform: scale(1.05); }

/* ── Content Containers & Hero Cards ── */
.page { display: none; animation: fadeIn .5s var(--silk-ease); }
.page.active { display: block; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }

.portal-hero {

}
